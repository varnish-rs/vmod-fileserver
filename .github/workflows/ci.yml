name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Varnish latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.ver }}" }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just install-varnish
      - run: just ci-test-latest

  test-varnish-ver:
    name: Test Varnish ${{ matrix.ver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - ver: 9.0
          - ver: 8.0
    steps:
      - uses: actions/checkout@v6
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.ver }}" }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just install-varnish ${{ matrix.ver }}
      - run: just ci-test

  # Smoke test on macOS. brew ships current Varnish with arm64 bottles, so
  # installation is fast. We install Varnish via brew (the justfile's
  # install-varnish recipe is Debian-specific) but otherwise use `just build`
  # and `just test`, which work cross-platform.
  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with: { key: "macos" }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - name: Install Varnish
        run: brew install varnish
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - name: Build workspace
        run: just build
      - name: Run tests
        run: just test

  # This job checks if any of the previous jobs failed or were canceled.
  # This approach also allows some jobs to be skipped if they are not needed.
  ci-passed:
    needs: [ test, test-varnish-ver, test-macos ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
